version: '3.8'

services:
  axisutah-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: axisutah-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: 'YourStrong!Passw0rd'
    ports:
      - '1436:1433'
    volumes:
      - axisutah-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  axisutah-sql-data:
    driver: local